services:
  # Microservice Backend - API Express.js
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: cordialement-backend
    # Gestion propre des signaux SIGTERM/SIGINT via Tini (PID 1)
    init: true
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
    networks:
      - cordialement-network

  # Microservice Frontend - Vue 3 / Nginx
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: cordialement-frontend
    # Gestion propre des signaux SIGTERM via Tini (PID 1)
    init: true
    restart: unless-stopped
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M
    networks:
      - cordialement-network

  # Reverse Proxy Nginx - Point d'entrée unique de l'architecture
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: cordialement-proxy
    # Gestion propre des signaux SIGTERM via Tini (PID 1)
    init: true
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M
    networks:
      - cordialement-network

networks:
  # Réseau privé Docker de type bridge isolant les conteneurs
  cordialement-network:
    driver: bridge
