services:
  # Microservice Backend - API Node.js
  backend:
    build: ./back
    container_name: cordialement-backend

    # Injecte le processus "tini" (PID 1) pour intercepter le signal d'arrêt (SIGTERM).
    # Permet à Node.js de fermer ses requêtes proprement au lieu d'être "tué" brutalement.
    init: true
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
    expose:
      # Ouvre le port spécifiquement sur le réseau privé Docker.
      - "3000"
    healthcheck:
      # Lance un appel régulier (wget) pour vérifier si l'API est vivante.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
    networks:
      - cordialement-network

  # Microservice Frontend - Vue 3 compilé servi par Nginx
  frontend:
    build: ./front
    container_name: cordialement-frontend
    init: true
    restart: unless-stopped
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M
    networks:
      - cordialement-network

  # Reverse Proxy Nginx - Point d'entrée sécurisé
  proxy:
    build: ./proxy
    container_name: cordialement-proxy
    init: true
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M
    networks:
      - cordialement-network

networks:
  # Réseau privé Docker de type bridge isolant les conteneurs
  cordialement-network:
    driver: bridge
